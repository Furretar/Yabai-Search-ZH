[project]
name = "yabai-dict"
version = "0.1.0"
description = "A CC-CEDICT Chinese-English dictionary web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[tool.uv]
package = false
