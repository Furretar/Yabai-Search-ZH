<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About - Yabai Search</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <!-- Web app manifest and icons, so the dictionary can be installed as an app. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ffca28">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/pwa-icon-180.png">
    <!-- Colour scheme variables; edit variables.css to retheme. -->
    <link rel="stylesheet" href="/static/variables.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
    <script>try{if(localStorage.getItem("yabai-theme")==="light")document.documentElement.classList.add("theme-light")}catch(e){}</script>
</head>

<body>
    <!-- Site title, kept the same on every page. -->
    <h1>
        <a id="home-link" href="/">牙白查词<span class="site-subtitle">Yabai Search<span
                    class="site-meta"><span class="site-zh">ZH</span><span
                        class="site-version">BETA v0.1</span></span></span></a>
    </h1>
    <main class="readme">
        {{ content | safe }}
    </main>

    <footer>
        <a href="/">← Back to search</a>
    </footer>
    <!-- Registers the service worker for installable web-app behaviour. -->
    <script src="/static/pwa.js" defer></script>
</body>

</html>
