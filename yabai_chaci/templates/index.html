<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Make the page scale correctly on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yabai-Chaci</title>
    <!-- Browser tab icon (served from the /static mount). -->
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <!-- Colour scheme variables; edit variables.css to retheme. -->
    <link rel="stylesheet" href="/static/variables.css">
    <!-- Stylesheet served from the /static mount (yabai_chaci/static/style.css). -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Page title / heading. -->
    <h1>
        <a id="home-link" href="/">牙白查词</a>
        <span class="site-subtitle">Yabai Search</span>
    </h1>
    <!-- Search bar and its options share one surface, so the expanded options
       look like a dropdown connected to the search bar. Wired up by app.js. -->
    <div class="search-panel">
        <form id="search-form" role="search" autocomplete="off">
            <input type="search" id="q" name="q" placeholder="Seach with English, Chinese, or Pinyin" autofocus>
            <button type="submit">Search</button>
        </form>
        <!-- Collapsed by default; the button toggles the panel (animated in CSS). -->
        <div class="options">
            <button type="button" class="options-toggle" aria-expanded="false" aria-controls="search-options">Search
                options</button>
            <div id="search-options" class="options-collapse">
                <div class="toggles">
                    <label><input type="checkbox" id="script-toggle"> Traditional</label>
                    <label><input type="checkbox" id="tone-toggle"> Tone coloring</label>
                    <label title="Use Zhuyin/Bopomofo/ㄅㄆㄇㄈ annotation."><input type="checkbox" id="phonetic-toggle">
                        Zhuyin</label>
                    <label title="Use Taiwanese Mandarin Pronunciation."><input type="checkbox" id="taiwan-toggle">
                        Taiwan</label>
                </div>
            </div>
        </div>
    </div>
    <!-- Centered description shown under the search bar. -->
    <p class="tagline">A Chinese-English dictionary powered by <a
            href="https://www.mdbg.net/chinese/dictionary?page=cedict" target="_blank" rel="noopener">CC-CEDICT</a>.
    <p class="tagline">Search Functions:
    <p class="tagline">汉字 - Simplified
    <p class="tagline">漢字 - Traditional
    <p class="tagline">汉* - All words that start with 汉 (Wildcard)

    </p>
    <!-- Parsed words from the input; each is clickable. -->
    <div id="parsed"></div>
    <!-- Reminder shown for latin (pinyin) searches. -->
    <p id="hint" class="muted" hidden></p>
    <!-- Where app.js renders the search results. -->
    <div id="results"></div>
    <!-- Front-end script served from the /static mount (static/app.js). -->
    <script src="/static/app.js"></script>
</body>

</html>
