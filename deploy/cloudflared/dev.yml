# Third tunnel: the laptop's dev copy, the one you edit (port 8001).
# Create with: cloudflared tunnel create yabai-dev
#   cloudflared tunnel route dns yabai-dev new.yabaisearch.org
# It is a separate tunnel so stopping or breaking it never touches the
# serving tunnels. Protect new. with Cloudflare Access (see PLAN.md).
tunnel: REPLACE_WITH_DEV_TUNNEL_ID
credentials-file: /home/YOUR_USER/.cloudflared/REPLACE_WITH_DEV_TUNNEL_ID.json

ingress:
  - hostname: new.yabaisearch.org
    service: http://127.0.0.1:8001
  - service: http_status:404
