# Tunnel for the laptop's serving copy (port 8000).
# Create with: cloudflared tunnel create yabai-laptop
# Then put the printed ID below and point DNS at it:
#   cloudflared tunnel route dns yabai-laptop laptop.yabaisearch.org
tunnel: REPLACE_WITH_LAPTOP_TUNNEL_ID
credentials-file: /home/YOUR_USER/.cloudflared/REPLACE_WITH_LAPTOP_TUNNEL_ID.json

ingress:
  - hostname: laptop.yabaisearch.org
    service: http://127.0.0.1:8000
  - service: http_status:404
