# Serve the editing checkout as the dev version.
# The template runs %h/yabai-%i, which would be ~/yabai-dev; on this machine the
# working copy is ~/Documents/Yabai-Search, so override just the dev instance
# and leave yabai-app@laptop on the template.
[Service]
ExecStart=
ExecStart=%h/Documents/Yabai-Search/deploy/run.sh dev
